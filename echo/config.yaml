## cSpell:ignore yfinance
# cSpell:ignore fomc
timezone: America/Chicago

slots:
  core: QQQ
  momentum: TSLA
  wildcard: AMZN

risk:
  cash_buffer_percent: 5
  max_risk_per_trade_usd: 75
  max_slot_risk_usd: 100
  kill_switch_drawdown_30d_pct: 20
  loan_stop_pct: -6

loan_accelerator:
  enabled: true
  min_expected_two_week_net_pct: 12
  deploy_fraction: 0.55
  min_repayment_odds: 0.75
  allow_dual: true
  loan_cap_usd: 500

injections:
  weekly_usd: 150
  timing: smart
  tom_preference: true

providers:
  price_data:
    name: yfinance

calendar:
  # FOMC DECISION days (the 2nd/final day of each meeting — the statement drops
  # ~14:00 ET that day; FOMCTilt fires the day BEFORE each date listed here).
  # Source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  # (verified 2026-08-18). Remaining 2026 meetings + all announced 2027 meetings.
  fomc_dates:
    - "2026-09-16"   # Sep 15-16, 2026 (SEP)
    - "2026-10-28"   # Oct 27-28, 2026
    - "2026-12-09"   # Dec 8-9, 2026 (SEP)
    - "2027-01-27"   # Jan 26-27, 2027
    - "2027-03-17"   # Mar 16-17, 2027 (SEP)
    - "2027-04-28"   # Apr 27-28, 2027
    - "2027-06-09"   # Jun 8-9, 2027 (SEP)
    - "2027-07-28"   # Jul 27-28, 2027
    - "2027-09-15"   # Sep 14-15, 2027 (SEP)
    - "2027-10-27"   # Oct 26-27, 2027
    - "2027-12-08"   # Dec 7-8, 2027 (SEP)
  # Earnings dates are fetched live from yfinance at signal time; the entries
  # below are only an OFFLINE FALLBACK. When the live fetch fails AND the
  # fallback date is stale, the PEAD signal says so explicitly instead of
  # silently reading "no signal".
  earnings:
    AMZN: "2025-10-29"
    TSLA: "2025-10-15"

whispers:
  AMZN:
    consensus_eps: 1.05
    whisper_eps: 1.18
  TSLA:
    consensus_eps: 0.62
    whisper_eps: 0.65

sector_etfs:
  TECH: XLK
  DISCRETIONARY: XLY
  SEMIS: SOXX
  DEFENSE: ITA
  RETAIL: XRT
  ENERGY: XLE

reporting:
  out_dir: reports
  include_weekly_dashboard: true
  severity_colors: true
rr_heatmap:
  green_min: 1.5
  yellow_min: 1.0
  red_max: 1.0
  stop_pct: 5
  target_pct: 10
loan_heat_map:
  active_min: 70
  watch_min: 30
  color_bands:
    active: green
    watch: yellow
    standby: gray
