name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Run tests (if tests exist)
      run: |
        if [ -d "tests" ]; then
          pytest tests/ --cov=echo --cov-report=xml --cov-report=html
        else
          echo "No tests directory found, skipping tests"
        fi
      continue-on-error: true
    
    - name: Check imports
      run: |
        python -c "import echo; print('Echo module imports successfully')"
        python -c "from echo.engine.echo_engine import EchoEngine; print('EchoEngine imports successfully')"
        python -c "from echo.ml.predictor import StockPredictor; print('StockPredictor imports successfully')"
        python -c "from echo.ml.backtester import Backtester; print('Backtester imports successfully')"
        python -c "from echo.ml.sentiment import SentimentAnalyzer; print('SentimentAnalyzer imports successfully')"
        python -c "from echo.portfolio.tracker import PortfolioTracker; print('PortfolioTracker imports successfully')"

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t echo-ai-dashboard:test .
    
    - name: Test Docker image
      run: |
        docker run --rm echo-ai-dashboard:test python -c "import streamlit; import pandas; import numpy; print('Docker image OK')"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
